[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.43",
    "langgraph>=1.1",
    "langchain>=1.2",
    "langchain-google-genai>=4.1",
    "langchain-groq>=0.3",
    "langchain-community>=0.3",
    "tavily-python>=0.5",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "reportlab>=4.2",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]